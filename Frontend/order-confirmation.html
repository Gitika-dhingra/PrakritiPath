<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed - PrakritiPath</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f7f3ee;
        --card: #fffaf3;
        --ink: #22303c;
        --accent: #b76e79;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Inter', sans-serif;
        color: var(--ink);
        background:
            radial-gradient(circle at top, rgba(183, 110, 121, 0.16), transparent 28%),
            linear-gradient(135deg, #f5efe8, #f0e7dc 55%, #f8f4ef);
    }
    .card {
        width: min(680px, calc(100% - 32px));
        background: var(--card);
        border: 1px solid rgba(183, 110, 121, 0.22);
        border-radius: 24px;
        padding: 40px 32px;
        box-shadow: 0 24px 60px rgba(34, 48, 60, 0.12);
        text-align: center;
    }
    h1 {
        margin: 0 0 12px;
        font-family: 'Cinzel Decorative', serif;
        color: var(--accent);
        font-size: clamp(2rem, 4vw, 3rem);
    }
    p {
        margin: 0 auto 18px;
        max-width: 42rem;
        line-height: 1.7;
    }
    .meta {
        display: grid;
        gap: 10px;
        margin: 24px 0 32px;
        padding: 18px;
        border-radius: 18px;
        background: rgba(212, 175, 55, 0.08);
    }
    .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }
    a {
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
    }
    .primary {
        background: var(--accent);
        color: white;
    }
    .secondary {
        background: white;
        color: var(--ink);
        border: 1px solid rgba(34, 48, 60, 0.16);
    }
</style>
</head>
<body>
    <main class="card">
        <h1>Order Confirmed</h1>
        <p>Your medicine order was submitted successfully. We will process it and update your account with the latest status.</p>
        <div class="meta">
            <div>Keep your delivery details up to date for faster processing.</div>
            <div>Need another order or status check? Return to your dashboard.</div>
        </div>
        <div class="actions">
            <a class="primary" href="Userdashboard.html">Go to Dashboard</a>
            <a class="secondary" href="paymentgateway.html">Place Another Order</a>
        </div>
    </main>
</body>
</html>
